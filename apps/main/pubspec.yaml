name: triva_app
description: "TRIVA — Trade-In Vehicle Appraisal."
publish_to: none
version: 1.0.11+12

environment:
  sdk: ">=3.5.0 <4.0.0"

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  core:
  features_shared:
  flutter_riverpod: ^3.3.1
  riverpod_annotation: ^4.0.2
  go_router: ^17.2.3
  equatable: ^2.0.7
  dio: ^5.9.2
  image_picker: ^1.2.2
  path_provider: ^2.1.5
  drift: ^2.33.0
  package_info_plus: ^10.1.0
  firebase_core: ^3.15.2
  firebase_messaging: ^15.2.10
  flutter_map: ^8.3.1
  latlong2: ^0.10.1
  geolocator: ^14.0.3
  url_launcher: ^6.3.2
  share_plus: ^13.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mocktail: ^1.0.4
  riverpod_generator: ^4.0.3
  build_runner: ^2.4.13
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8

flutter:
  uses-material-design: true
  assets:
    - assets/branding/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/branding/triva_app_icon.png
  remove_alpha_ios: true
  adaptive_icon_background: "#F6F8FA"
  adaptive_icon_foreground: assets/branding/triva_app_icon_foreground.png
  web:
    generate: true
    image_path: assets/branding/triva_app_icon.png
    background_color: "#F6F8FA"
    theme_color: "#062A66"

flutter_native_splash:
  color: "#F6F8FA"
  color_dark: "#0D1420"
  image: assets/branding/triva_mark.png
  android_12:
    color: "#F6F8FA"
    color_dark: "#0D1420"
    image: assets/branding/triva_app_icon_foreground.png

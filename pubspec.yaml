name: triva_workspace
publish_to: none

environment:
  sdk: ">=3.5.0 <4.0.0"

dev_dependencies:
  melos: ^7.7.0

workspace:
  - packages/core
  - packages/features_shared
  - apps/main

melos:
  packages:
    - apps/**
    - packages/**
  scripts:
    dev:
      run: cd apps/main && flutter run --dart-define=ENV=dev
      description: Run the main app in dev environment.

    l10n:
      run: cd packages/core && flutter gen-l10n
      description: Generate localization files for the core package.

    codegen:
      run: dart run build_runner build --delete-conflicting-outputs
      description: Run code generation (Riverpod, Drift, etc.) for all packages
      packageFilters:
        dependsOn: build_runner

    postbootstrap:
      run: melos run l10n && melos run codegen
      description: Auto-generate l10n and run codegen after bootstrap

    analyze:
      run: dart analyze packages/core packages/features_shared apps/main
      description: Analyze the TRIVA app and shared packages.

    format:
      run: dart format --line-length=80 packages apps
      description: Format all Dart files (excludes bricks/ which contains Mason templates).

    "format:check":
      run: dart format --output=none --set-exit-if-changed packages apps
      description: Check Dart formatting without changing files.

    build:android:
      run: cd apps/main && flutter build apk --dart-define=ENV=prod
      description: Build the TRIVA Android APK.

    "build:android:main":
      run: cd apps/main && flutter build apk --dart-define=ENV=prod
      description: Build Android APK for the main app.

    build:ios:
      run: cd apps/main && flutter build ipa --dart-define=ENV=prod
      description: Build the TRIVA iOS IPA.

    "build:ios:main":
      run: cd apps/main && flutter build ipa --dart-define=ENV=prod
      description: Build iOS IPA for the main app.

    build:web:
      run: cd apps/main && flutter build web --dart-define=ENV=prod
      description: Build the TRIVA web app.

    "build:web:main":
      run: cd apps/main && flutter build web --dart-define=ENV=prod
      description: Build web output for the main app.

    "deploy:web:main":
      run: cd apps/main && firebase deploy --only hosting:triva --project triva-7138e
      description: Deploy the current main-app web build to https://triva.web.app.

    test:
      run: cd packages/core && flutter test && cd ../features_shared && flutter test && cd ../../apps/main && flutter test
      description: Run tests for TRIVA and its shared packages.

    "test:core":
      run: cd packages/core && flutter test
      description: Run tests for the core package.

    "test:features_shared":
      run: cd packages/features_shared && flutter test
      description: Run tests for the features_shared package.

    "test:main":
      run: cd apps/main && flutter test
      description: Run tests for the main app.
